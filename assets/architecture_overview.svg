<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #4b6886; }
      .section { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .note { font-size: 13px; fill: #62809f; }
      .card { stroke: #274d7d; stroke-width: 2; }
      .lane { stroke: #d8e5f2; stroke-width: 2; }
      .arrow { stroke: #274d7d; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#274d7d"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#f6f9fc"/>

  <text x="70" y="70" class="title">Janus (AdaptShield) Architecture</text>
  <text x="70" y="104" class="subtitle">A two-phase enterprise incident-response benchmark with tool-mediated investigation, attacker pivots, and mission-aware grading.</text>

  <line x1="70" y1="145" x2="1330" y2="145" class="lane"/>

  <text x="70" y="185" class="section">Incident World</text>

  <rect x="70" y="210" width="280" height="145" rx="20" ry="20" fill="#e8f2ff" class="card"/>
  <text x="95" y="245" class="section">Enterprise Network</text>
  <text x="95" y="275" class="body">4-node service topology</text>
  <text x="95" y="300" class="body">auth_service, payment_service</text>
  <text x="95" y="325" class="body">database, api_gateway</text>

  <rect x="390" y="210" width="280" height="145" rx="20" ry="20" fill="#eef9f0" class="card"/>
  <text x="415" y="245" class="section">SOC Tool Surface</text>
  <text x="415" y="275" class="body">log_search, edr_status</text>
  <text x="415" y="300" class="body">cmdb, vuln, identity</text>
  <text x="415" y="325" class="body">change_calendar, netflow</text>

  <rect x="710" y="210" width="280" height="145" rx="20" ry="20" fill="#fff3e8" class="card"/>
  <text x="735" y="245" class="section">Adaptive Attacker</text>
  <text x="735" y="275" class="body">recon -> exploit -> exfiltration</text>
  <text x="735" y="300" class="body">mid-episode pivots</text>
  <text x="735" y="325" class="body">hard-task polymorphism</text>

  <rect x="1030" y="210" width="300" height="145" rx="20" ry="20" fill="#f4efff" class="card"/>
  <text x="1055" y="245" class="section">Operational Context</text>
  <text x="1055" y="275" class="body">mission profile</text>
  <text x="1055" y="300" class="body">world-family split</text>
  <text x="1055" y="325" class="body">latent operational mode</text>

  <line x1="70" y1="400" x2="1330" y2="400" class="lane"/>

  <text x="70" y="440" class="section">Two-Phase Agent Loop</text>

  <rect x="110" y="475" width="360" height="190" rx="22" ry="22" fill="#fff8eb" class="card"/>
  <text x="140" y="515" class="section">Phase 1: Threat Analyst</text>
  <text x="140" y="548" class="body">Sees raw alerts, node metrics, attack stage,</text>
  <text x="140" y="572" class="body">history, mission context, and tool evidence.</text>
  <text x="140" y="606" class="body">Outputs threat type, confidence, target node,</text>
  <text x="140" y="630" class="body">and recommended action.</text>
  <text x="140" y="658" class="note">This phase is graded on classification quality and sets up the handoff.</text>

  <rect x="525" y="505" width="180" height="130" rx="22" ry="22" fill="#ffffff" class="card"/>
  <text x="555" y="550" class="section">Structured</text>
  <text x="565" y="578" class="section">Handoff</text>
  <text x="548" y="610" class="note">confidence, target,</text>
  <text x="555" y="630" class="note">recommended action</text>

  <rect x="760" y="475" width="360" height="190" rx="22" ry="22" fill="#ffeceb" class="card"/>
  <text x="790" y="515" class="section">Phase 2: Tactical Executor</text>
  <text x="790" y="548" class="body">Blind to raw network state.</text>
  <text x="790" y="572" class="body">Receives only the analyst handoff and history.</text>
  <text x="790" y="606" class="body">Chooses the mitigation under uncertainty and</text>
  <text x="790" y="630" class="body">operational constraints.</text>
  <text x="790" y="658" class="note">This phase exposes communication failures and decision errors separately.</text>

  <rect x="1160" y="475" width="170" height="190" rx="22" ry="22" fill="#eef4ff" class="card"/>
  <text x="1185" y="515" class="section">Deterministic</text>
  <text x="1205" y="543" class="section">Grader</text>
  <text x="1185" y="580" class="body">security correctness</text>
  <text x="1185" y="605" class="body">false-positive penalty</text>
  <text x="1185" y="630" class="body">business impact</text>
  <text x="1185" y="655" class="body">mission alignment</text>

  <path d="M350 355 L350 455" class="arrow"/>
  <path d="M530 570 L470 570" class="arrow"/>
  <path d="M705 570 L760 570" class="arrow"/>
  <path d="M1120 570 L1160 570" class="arrow"/>

  <text x="332" y="430" class="note">observations</text>
  <text x="490" y="553" class="note">assessment</text>
  <text x="718" y="553" class="note">execution</text>
  <text x="1125" y="553" class="note">reward</text>
</svg>
