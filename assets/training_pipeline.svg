<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #4b6886; }
      .section { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .note { font-size: 13px; fill: #62809f; }
      .card { stroke: #274d7d; stroke-width: 2; }
      .arrow { stroke: #274d7d; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .lane { stroke: #d8e5f2; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#274d7d"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#f6f9fc"/>

  <text x="70" y="70" class="title">Janus (AdaptShield) Training Pipeline</text>
  <text x="70" y="104" class="subtitle">Environment-derived supervision builds the initial policy; held-out family evaluation measures transfer; GRPO tests whether reward-guided refinement helps.</text>

  <line x1="70" y1="145" x2="1330" y2="145" class="lane"/>

  <rect x="80" y="190" width="250" height="150" rx="20" ry="20" fill="#e8f2ff" class="card"/>
  <text x="105" y="228" class="section">1. Generate SFT Data</text>
  <text x="105" y="260" class="body">teacher rollouts</text>
  <text x="105" y="286" class="body">train world families only</text>
  <text x="105" y="312" class="body">tool traces + actions</text>

  <rect x="400" y="190" width="250" height="150" rx="20" ry="20" fill="#fff3e8" class="card"/>
  <text x="425" y="228" class="section">2. SFT Warm Start</text>
  <text x="425" y="260" class="body">LoRA fine-tuning</text>
  <text x="425" y="286" class="body">loss curve</text>
  <text x="425" y="312" class="body">checkpoint saves</text>

  <rect x="720" y="190" width="250" height="150" rx="20" ry="20" fill="#eef9f0" class="card"/>
  <text x="745" y="228" class="section">3. SFT Evaluation</text>
  <text x="745" y="260" class="body">train-family score</text>
  <text x="745" y="286" class="body">held-out-family score</text>
  <text x="745" y="312" class="body">checkpoint reward curve</text>

  <rect x="1040" y="190" width="280" height="150" rx="20" ry="20" fill="#f4efff" class="card"/>
  <text x="1065" y="228" class="section">4. GRPO Prompt Bank</text>
  <text x="1065" y="260" class="body">hard-task emphasis</text>
  <text x="1065" y="286" class="body">borderline rollouts</text>
  <text x="1065" y="312" class="body">tool-fusion-heavy prompts</text>

  <path d="M330 265 L400 265" class="arrow"/>
  <path d="M650 265 L720 265" class="arrow"/>
  <path d="M970 265 L1040 265" class="arrow"/>

  <line x1="70" y1="410" x2="1330" y2="410" class="lane"/>

  <rect x="180" y="455" width="310" height="185" rx="22" ry="22" fill="#ffeceb" class="card"/>
  <text x="210" y="495" class="section">5. GRPO Refinement</text>
  <text x="210" y="528" class="body">starts from the SFT adapter</text>
  <text x="210" y="554" class="body">short RL schedule, low LR</text>
  <text x="210" y="580" class="body">tries to improve task reward without</text>
  <text x="210" y="606" class="body">destroying the supervised policy</text>
  <text x="210" y="632" class="note">This stage is intentionally harder to win than SFT.</text>

  <rect x="545" y="455" width="310" height="185" rx="22" ry="22" fill="#eef4ff" class="card"/>
  <text x="575" y="495" class="section">6. Final Comparison</text>
  <text x="575" y="528" class="body">no-tool baseline</text>
  <text x="575" y="554" class="body">tool-aware baseline</text>
  <text x="575" y="580" class="body">SFT train and held-out families</text>
  <text x="575" y="606" class="body">GRPO train and held-out families</text>
  <text x="575" y="632" class="note">This is where the benchmark shows whether RL actually helps.</text>

  <rect x="910" y="455" width="320" height="185" rx="22" ry="22" fill="#ffffff" class="card"/>
  <text x="940" y="495" class="section">7. Published Artifacts</text>
  <text x="940" y="528" class="body">benchmark table</text>
  <text x="940" y="554" class="body">SFT loss curve</text>
  <text x="940" y="580" class="body">SFT held-out reward curve</text>
  <text x="940" y="606" class="body">GRPO hard-task reward curve</text>
  <text x="940" y="632" class="note">The benchmark story is carried by these outputs, not by raw logs.</text>

  <path d="M1180 340 L1180 425" class="arrow"/>
  <path d="M1040 550 L855 550" class="arrow"/>
  <path d="M545 550 L490 550" class="arrow"/>

  <text x="1192" y="390" class="note">warm-start source</text>
  <text x="880" y="535" class="note">results</text>
  <text x="505" y="535" class="note">policy</text>
</svg>
