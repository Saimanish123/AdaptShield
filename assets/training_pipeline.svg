<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #17324d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #45627f; }
      .section { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; }
      .note { font-size: 13px; fill: #5c7792; }
      .border { stroke: #274d7d; stroke-width: 2; }
      .arrow { stroke: #274d7d; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#274d7d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f7f9fc"/>
  <text x="60" y="60" class="title">Janus (AdaptShield) Training Pipeline</text>
  <text x="60" y="92" class="subtitle">Environment-generated demonstrations warm-start the policy; GRPO then refines it while held-out family evaluation measures transfer.</text>

  <rect x="70" y="150" width="210" height="170" rx="18" ry="18" fill="#e8f3ff" class="border"/>
  <text x="92" y="184" class="section">1. Generate SFT Data</text>
  <text x="92" y="216" class="body">teacher rollouts</text>
  <text x="92" y="240" class="body">train families only</text>
  <text x="92" y="264" class="body">tool traces + actions</text>
  <text x="92" y="288" class="note">Output: JSONL supervision set</text>

  <rect x="350" y="150" width="210" height="170" rx="18" ry="18" fill="#fff4e8" class="border"/>
  <text x="372" y="184" class="section">2. SFT Warm Start</text>
  <text x="372" y="216" class="body">LoRA on compact base model</text>
  <text x="372" y="240" class="body">loss curve</text>
  <text x="372" y="264" class="body">checkpoint saves</text>
  <text x="372" y="288" class="note">Output: SFT adapter</text>

  <rect x="630" y="150" width="210" height="170" rx="18" ry="18" fill="#eef8ef" class="border"/>
  <text x="652" y="184" class="section">3. SFT Evaluation</text>
  <text x="652" y="216" class="body">train-family score</text>
  <text x="652" y="240" class="body">held-out-family score</text>
  <text x="652" y="264" class="body">reward curve</text>
  <text x="652" y="288" class="note">Output: metrics + plots</text>

  <rect x="910" y="150" width="210" height="170" rx="18" ry="18" fill="#f1edff" class="border"/>
  <text x="932" y="184" class="section">4. Prompt Bank</text>
  <text x="932" y="216" class="body">hard-task emphasis</text>
  <text x="932" y="240" class="body">borderline episodes</text>
  <text x="932" y="264" class="body">tool-fusion prompts</text>
  <text x="932" y="288" class="note">Output: GRPO rollouts</text>

  <rect x="210" y="430" width="260" height="180" rx="18" ry="18" fill="#ffeceb" class="border"/>
  <text x="232" y="464" class="section">5. GRPO Refinement</text>
  <text x="232" y="496" class="body">start from SFT adapter</text>
  <text x="232" y="520" class="body">short RL schedule</text>
  <text x="232" y="544" class="body">preserve a stable policy</text>
  <text x="232" y="568" class="note">Output: GRPO adapter</text>

  <rect x="540" y="430" width="260" height="180" rx="18" ry="18" fill="#eef8ef" class="border"/>
  <text x="562" y="464" class="section">6. Final Evaluation</text>
  <text x="562" y="496" class="body">easy / medium / hard</text>
  <text x="562" y="520" class="body">train vs held-out family</text>
  <text x="562" y="544" class="body">SFT vs GRPO delta</text>
  <text x="562" y="568" class="note">Output: final benchmark metrics</text>

  <rect x="870" y="430" width="260" height="180" rx="18" ry="18" fill="#ffffff" class="border"/>
  <text x="892" y="464" class="section">7. Submission Package</text>
  <text x="892" y="496" class="body">benchmark table</text>
  <text x="892" y="520" class="body">loss + reward plots</text>
  <text x="892" y="544" class="body">README, notebook, demo</text>
  <text x="892" y="568" class="note">Output: judge-facing deliverables</text>

  <path d="M280 235 L350 235" class="arrow"/>
  <path d="M560 235 L630 235" class="arrow"/>
  <path d="M840 235 L910 235" class="arrow"/>
  <path d="M1015 320 L1015 390" class="arrow"/>
  <path d="M910 520 L800 520" class="arrow"/>
  <path d="M540 520 L470 520" class="arrow"/>

  <text x="300" y="220" class="note">supervision</text>
  <text x="580" y="220" class="note">checkpoint sweep</text>
  <text x="865" y="220" class="note">hard examples</text>
  <text x="1028" y="362" class="note">warm-start input</text>
  <text x="815" y="505" class="note">results</text>
  <text x="488" y="505" class="note">refined policy</text>
</svg>
