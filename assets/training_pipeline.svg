<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#0f172a"/>
    </marker>
    <style>
      .h1   { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub  { font-size: 14px; fill: #64748b; }
      .step { font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.06em; }
      .card { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 13px; fill: #0f172a; }
      .meta { font-size: 12px; fill: #475569; }
      .note { font-size: 12px; font-style: italic; fill: #64748b; }
      .lbl  { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .cardbox { fill: #ffffff; stroke: #1e293b; stroke-width: 1.5; }
      .hicard  { fill: #eff6ff; stroke: #1e293b; stroke-width: 1.5; }
      .subbox  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
      .flow { stroke: #0f172a; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="600" fill="#fafbfc"/>

  <text x="40" y="46" class="h1">Janus — Training Pipeline</text>
  <text x="40" y="72" class="sub">Teacher data → LoRA SFT warm-start → GRPO refinement (two variants) → held-out eval → publish.</text>

  <!-- =================== STEP 1 =================== -->
  <g>
    <rect x="20" y="120" width="215" height="220" rx="10" class="cardbox"/>
    <text x="34" y="144" class="step">STEP 1</text>
    <text x="34" y="170" class="card">Generate SFT data</text>

    <text x="34" y="200" class="body">Scripted teacher policy</text>
    <text x="34" y="221" class="body">rolled out on train-family</text>
    <text x="34" y="242" class="body">worlds only</text>
    <text x="34" y="278" class="meta">~3k episodes</text>
    <text x="34" y="298" class="meta">tool traces + actions</text>
    <text x="34" y="318" class="meta">→ chat-format JSONL</text>
  </g>

  <!-- =================== STEP 2 =================== -->
  <g>
    <rect x="247" y="120" width="215" height="220" rx="10" class="hicard"/>
    <text x="261" y="144" class="step">STEP 2</text>
    <text x="261" y="170" class="card">SFT warm-start</text>

    <text x="261" y="200" class="body">Qwen2.5-1.5B-Instruct</text>
    <text x="261" y="221" class="body">+ LoRA (r=64, α=128)</text>
    <text x="261" y="242" class="body">on the SFT dataset</text>
    <text x="261" y="278" class="meta">378 steps · 9m 49s</text>
    <text x="261" y="298" class="meta">L4 ×1 (HF Jobs)</text>
    <text x="261" y="318" class="meta">loss + reward curves</text>
  </g>

  <!-- =================== STEP 3: GRPO (wider box) =================== -->
  <g>
    <rect x="474" y="120" width="320" height="220" rx="10" class="hicard"/>
    <text x="488" y="144" class="step">STEP 3</text>
    <text x="488" y="170" class="card">GRPO refinement</text>
    <text x="488" y="190" class="meta">starts from the SFT adapter · two production runs</text>

    <rect x="488" y="208" width="294" height="56" rx="6" class="subbox"/>
    <text x="500" y="227" class="lbl">Mixed curriculum</text>
    <text x="500" y="247" class="meta">direct 0.3 / dual 0.4 / poly 0.3 · 1,628 ep · 1h 26m</text>
    <text x="500" y="261" class="meta">grpo_worldsplit_1_5b</text>

    <rect x="488" y="272" width="294" height="56" rx="6" class="subbox"/>
    <text x="500" y="291" class="lbl">Hard-task focus</text>
    <text x="500" y="311" class="meta">polymorphic-zero-day only · 4,357 ep · 3h 17m</text>
    <text x="500" y="325" class="meta">grpo_polymorphic_zero_day_1_5b</text>
  </g>

  <!-- =================== STEP 4 =================== -->
  <g>
    <rect x="806" y="120" width="215" height="220" rx="10" class="cardbox"/>
    <text x="820" y="144" class="step">STEP 4</text>
    <text x="820" y="170" class="card">Held-out eval</text>

    <text x="820" y="200" class="body">50 deterministic seeds</text>
    <text x="820" y="221" class="body">per task on eval-a/-b</text>
    <text x="820" y="242" class="body">world families only</text>
    <text x="820" y="278" class="meta">vs no-tool baseline</text>
    <text x="820" y="298" class="meta">vs tool-aware baseline</text>
    <text x="820" y="318" class="meta">vs SFT-only checkpoint</text>
  </g>

  <!-- =================== STEP 5 =================== -->
  <g>
    <rect x="1033" y="120" width="227" height="220" rx="10" class="cardbox"/>
    <text x="1047" y="144" class="step">STEP 5</text>
    <text x="1047" y="170" class="card">Publish artifacts</text>

    <text x="1047" y="200" class="body">Adapters + curves</text>
    <text x="1047" y="221" class="body">Per-episode metrics</text>
    <text x="1047" y="242" class="body">Benchmark table</text>
    <text x="1047" y="263" class="body">Stdout logs</text>
    <text x="1047" y="298" class="meta">all on HF Hub:</text>
    <text x="1047" y="318" class="meta" font-weight="600">SaiManish123/Janus</text>
  </g>

  <!-- =================== ARROWS =================== -->
  <path d="M 235 230 L 247 230" class="flow" marker-end="url(#arrow)"/>
  <path d="M 462 230 L 474 230" class="flow" marker-end="url(#arrow)"/>
  <path d="M 794 230 L 806 230" class="flow" marker-end="url(#arrow)"/>
  <path d="M 1021 230 L 1033 230" class="flow" marker-end="url(#arrow)"/>

  <!-- =================== HARDWARE / REPRODUCER FOOTER =================== -->
  <g>
    <rect x="20" y="400" width="1240" height="74" rx="10" class="cardbox"/>
    <text x="40" y="424" class="lbl">Production hardware</text>
    <text x="40" y="445" class="body">Hugging Face Jobs · L4 ×1 (24 GB) · bf16 · Unsloth + TRL · single-node</text>
    <text x="40" y="464" class="meta">Combined wall-clock for SFT + both GRPO variants: ~4h 53m.</text>

    <line x1="660" y1="412" x2="660" y2="464" stroke="#cbd5e1" stroke-width="1"/>

    <text x="680" y="424" class="lbl">Free-tier reproducer (Colab)</text>
    <text x="680" y="445" class="body">Same pipeline scaled to Qwen2.5-0.5B + reduced budget on T4.</text>
    <text x="680" y="464" class="meta">~35 min end-to-end. README numbers are from the L4 1.5B run.</text>
  </g>

  <!-- =================== EVAL BREAKDOWN STRIP =================== -->
  <g>
    <text x="40" y="510" class="step">EVAL CONTRACT</text>
    <text x="40" y="534" class="body"><tspan font-weight="700">Disjoint train / eval split:</tspan> world families train-a, train-b are never seen at eval; eval-a, eval-b are never seen at train.</text>
    <text x="40" y="554" class="body"><tspan font-weight="700">Reward:</tspan> deterministic Python — no LLM-as-judge.   <tspan font-weight="700">Score range:</tspan> clamped to (0.01, 0.99) so GRPO advantage estimates stay non-degenerate.</text>
  </g>
</svg>
